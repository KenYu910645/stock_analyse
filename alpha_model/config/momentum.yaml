data:
  price_dir: data/price
  metadata_path: data/metadata.csv
  allow_unfiltered_universe: false
  date_col: Date
  stock_id_from_filename: true
  open_col: open_adj
  high_col: high_adj
  low_col: low_adj
  close_col: close_adj
  volume_col: Capacity
  turnover_col: Turnover

universe:
  min_price: 5
  min_avg_turnover_20d: 5000000
  min_history_days: 120

factor:
  winsorize_lower: 0.01
  winsorize_upper: 0.99
  zscore: true
  names:
    - momentum_20d
    - momentum_60d
    - momentum_120d
    - momentum_60_5
    - momentum_120_20
    - vol_adj_momentum_60d

labels:
  horizons: [1, 5, 10, 20]

evaluation:
  quantiles: 5
  primary_horizon: 5
  transaction_cost:
    enabled: false
    round_trip_cost: 0.006

output:
  dir: output/alpha_model/tables
  plot_dir: data_viz/alpha_model/plots

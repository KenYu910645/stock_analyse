services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb-market-data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescale-data:/var/lib/postgresql/data

volumes:
  timescale-data:
